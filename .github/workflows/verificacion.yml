name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Revisión de estilo
        run: npm run lint
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Compilación
        run: npm run build
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e
