name: Verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: pruebas
      # PostgreSQL temporal solo para estas pruebas; no es la base del sitio de pruebas.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Revisión de estilo
        run: npm run lint
      - name: Revisión de tipos
        run: npm run typecheck
      - name: Pruebas unitarias y de base de datos
        run: npm test
      - name: Migraciones sobre una base vacía
        run: |
          psql "$TEST_DATABASE_URL" -c "create database migracion_ci"
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/migracion_ci" npm run db:migrar
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/migracion_ci" npm run db:migrar
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/migracion_ci" npm run db:datos-prueba
      - name: Compilación
        run: npm run build
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo
        run: npm run test:e2e
