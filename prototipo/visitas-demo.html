<title>Visitas Tenango Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: plataforma en una columna (máx. 780px). Barra oscura de vista previa de rol, cabecera con logo y contexto, pestañas según perfil, tarjetas. Tema claro único (petición explícita). El color de marca cambia según la sucursal configurada. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --fg:#15191f; --muted:#5f6873; --line:#e0e4e9;
  --ok:#17703f; --ok-soft:#e3f3e9; --info:#1c5ca3; --info-soft:#e5eef9; --warn:#8a5300; --warn-soft:#fdf0d8; --off:#5f6873; --off-soft:#edf0f3; --bad:#b3261e;
  --demo-bg:#22272e; --demo-fg:#ffffff;
  --brand:#c62828; --brand-ink:#ffffff; --brand-soft:#fdecec; --brand-text:#b71c1c; --brand-line:#c62828;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--demo-bg)}
.rolebar{background:var(--demo-bg);color:var(--demo-fg)}
.rolebar-in{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.rolebar label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.rolebar select{font:700 15px var(--f-body);border-radius:8px;border:0;padding:6px 10px;background:#fff;color:#15191f}
.rolebar .rb-note{font-size:12.5px;opacity:.8;flex:1 1 240px}
.brandbar{height:5px;background:var(--brand)}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
header.ctx{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:46px;width:auto;max-width:100%;display:block;flex:none}
h1{font-size:21px;font-weight:800;margin:0;line-height:1.15;letter-spacing:-.01em}
.h1sub{font-size:13.5px;color:var(--muted)}
.demo{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px}
.ctxbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ctxitem{display:flex;flex-direction:column;padding:2px 8px;min-width:0}
.ctxitem .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ctxitem .v{font-weight:700;font-size:15px}
.ctxsep{width:1px;align-self:stretch;background:var(--line)}
.ctxitem select{font:700 15px var(--f-body);border:0;background:transparent;color:var(--fg);padding:0;cursor:pointer;max-width:100%}
.open{display:inline-flex;align-items:center;gap:6px}
.open::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
nav.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:700 14.5px var(--f-body);padding:10px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(20,25,31,.08),inset 0 -3px 0 var(--brand)}
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;font-weight:700;margin:0}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sub{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:14px}
input[type=text],input[type=tel],input[type=number],select.inp,textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid #cfd5dc;border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:60px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand-line);outline-offset:2px}
.g3{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.g3,.g2{grid-template-columns:1fr}}
.visitor{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.visitor.is-contact{border-color:var(--brand-line);box-shadow:inset 3px 0 0 var(--brand)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vnum{display:flex;align-items:center;gap:8px;font-weight:700}
.num{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800}
.radio-c{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.radio-c input{accent-color:var(--brand);width:16px;height:16px}
.visitor.is-contact .radio-c{color:var(--brand-text)}
.linkbtn{border:0;background:transparent;color:var(--muted);font:600 13.5px var(--f-body);cursor:pointer;padding:4px 6px;border-radius:6px}
.linkbtn:hover{color:var(--bad)}
.addv{border:1.5px dashed #c5ccd4;background:transparent;border-radius:12px;padding:12px;font:700 15px var(--f-body);color:var(--brand-text);cursor:pointer}
.addv:hover{background:var(--brand-soft);border-color:var(--brand-line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center;font-weight:700;background:var(--surface)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--brand-line);background:var(--brand-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--brand-line)}
.seg label:has(input:focus-visible){outline:2px solid var(--brand-line);outline-offset:2px}
@media (max-width:420px){.seg{grid-template-columns:1fr}}
.totalbox{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;align-items:end;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.totalbox .k{font-size:12.5px;color:var(--muted);font-weight:600}
.totalbox .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.totalbox .tot .v{font-size:30px;font-weight:800}
.totalbox .tot{text-align:right}
.money{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.01em}
.cashrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
@media (max-width:420px){.cashrow{grid-template-columns:1fr}}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:600 13.5px var(--f-body);cursor:pointer;color:var(--fg)}
.quick button:hover{border-color:var(--brand-line)}
.change{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.change .v{font-size:24px;font-weight:800}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:none}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.actions.left{justify-content:flex-start}
.btn{font:700 15px var(--f-body);border-radius:11px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.stickybar{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 -6px 18px rgba(20,25,31,.07)}
.stickybar .t{font-size:13.5px;color:var(--muted)}
.stickybar .t b{color:var(--fg);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-off{background:var(--off-soft);color:var(--off)}
.c-brand{background:var(--brand-soft);color:var(--brand-text)}
.pend{font-size:12.5px;font-weight:600;color:var(--warn)}
dl.kv{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:7px 14px;margin:0;font-size:15px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:420px){dl.kv{grid-template-columns:1fr;gap:0}dl.kv dd{margin-bottom:8px}}
.msg{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.msg strong{font-weight:700}
.m-ok{background:var(--ok-soft);border:1px solid #9ccfae}
.m-info{background:var(--info-soft);border:1px solid #a7c3e6}
.m-warn{background:var(--warn-soft);border:1px solid #e7c486}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .big{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.vlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.vname{font-weight:700;font-size:16px}
.vmeta{font-size:14px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.inline{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.breakdown{display:flex;flex-direction:column;gap:6px;font-size:15px}
.breakdown .ln{display:flex;justify-content:space-between;gap:12px}
.breakdown .ln.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .t{font-size:13px;color:var(--muted);line-height:1.3;font-weight:600}
.stat.warn{background:var(--warn-soft);border-color:#ecd3a3}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 13px;font:600 13.5px var(--f-body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:inherit;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .when{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.row .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.row .chips{grid-column:2 / 4}
.empty{padding:26px;text-align:center;color:var(--muted)}
details.log summary{cursor:pointer;font-weight:700;font-size:14.5px}
.histlog{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.histlog li{border-left:2px solid var(--line);padding-left:10px}
.histlog .hl-t{font-size:12.5px;color:var(--muted)}
details.demoopt{font-size:14px;color:var(--muted)}
details.demoopt summary{cursor:pointer;font-weight:600}
.receipt{max-width:380px;width:100%;margin-inline:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 18px 22px;display:flex;flex-direction:column;gap:10px;font-size:14.5px;box-shadow:0 2px 10px rgba(20,25,31,.06)}
.receipt .rhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:1px dashed #c9cfd6;padding-bottom:10px}
.receipt .rhead img{height:60px;width:auto}
.receipt .stamp{border:2px solid var(--bad);color:var(--bad);font-weight:800;font-size:12px;letter-spacing:.1em;padding:3px 10px;border-radius:4px;transform:rotate(-2deg)}
.receipt .ln{display:flex;justify-content:space-between;gap:12px}
.receipt .tot{border-top:1px dashed #c9cfd6;padding-top:8px;font-weight:800;font-size:18px}
.receipt .fine{font-size:12.5px;color:var(--muted);text-align:center;border-top:1px dashed #c9cfd6;padding-top:10px}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:600;background:var(--surface)}
.swatch{width:18px;height:18px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.12)}
.swatch.pendc{background:repeating-linear-gradient(45deg,#d5d9de 0 3px,#fff 3px 6px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{border:1.5px dashed #c5ccd4;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.tile .tn{font-weight:700}
.tile .td{font-size:13.5px;color:var(--muted)}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.perm{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.perm .pa{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.perm .pv{font-size:14px;font-weight:600;line-height:1.35}
.perm.yes{background:var(--ok-soft);border-color:#b5dcc2}
.perm.cond{background:var(--warn-soft);border-color:#ecd3a3}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:600px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:700}
td.nr,th.nr{text-align:right;font-variant-numeric:tabular-nums}
.tlink{border:0;background:transparent;font:700 15px var(--f-body);color:var(--fg);cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:8px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.colorrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=color]{width:52px;height:46px;border:1px solid #cfd5dc;border-radius:10px;padding:3px;background:var(--surface);cursor:pointer}
.colorrow input[type=text]{width:130px;font-family:var(--f-mono)}
.preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pv-btn{font:700 14px var(--f-body);border-radius:9px;padding:8px 14px;border:1px solid transparent}
.pv-chip{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.readonly{font-family:var(--f-mono);font-size:13.5px;background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--muted)}
.reg{display:grid;gap:16px;align-items:start}
.payact{display:none}
@media (min-width:900px){.reg{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.paycol{position:sticky;top:12px}.payact{display:flex}.stickybar{display:none}}
.period{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:4px 10px;align-self:flex-start}
.todo{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.todo-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.todo-i:last-child{border-bottom:0}
.todo-i .tt{font-weight:700}
.todo-i .td{font-size:13.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="rolebar">
  <div class="rolebar-in">
    <label for="role">Vista previa de rol</label>
    <select id="role"></select>
    <span class="rb-note">Solo para demostrar. En el sistema real cada persona entra con su cuenta y no puede cambiar de rol.</span>
  </div>
</div>
<div class="brandbar" aria-hidden="true"></div>
<div class="wrap">

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}

/* ---------- Color por sucursal con contraste calculado ---------- */
function hexOk(h){return /^#[0-9a-fA-F]{6}$/.test(h||"");}
function rgb(h){h=h.replace("#","");return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16);});}
function hex(c){return "#"+c.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");}).join("");}
function lum(c){var a=c.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return .2126*a[0]+.7152*a[1]+.0722*a[2];}
function contrast(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
function mix(a,b,w){return a.map(function(v,i){return v*(1-w)+b[i]*w;});}
function darkenTo(c,min){var W=[255,255,255],K=[0,0,0],r=c;for(var i=0;i<=20&&contrast(r,W)<min;i++)r=mix(c,K,i*0.05);return r;}
function themeOf(color){
  var c=rgb(hexOk(color)?color:NEUTRAL),W=[255,255,255],D=[26,26,26];
  var ink=contrast(c,W)>=contrast(c,D)?"#ffffff":"#1a1a1a";
  return {brand:hex(c),ink:ink,soft:hex(mix(c,W,.88)),text:hex(darkenTo(c,4.5)),line:hex(darkenTo(c,3)),inkContrast:Math.max(contrast(c,W),contrast(c,D))};
}

function saveCfg(){
  var c=S.cfg,d=c.d,e={},b=c.id?brById(c.id):null,locked=b&&S.data[b.id].ops.length>0;
  d.nombre=d.nombre.trim();d.codigo=d.codigo.trim().toUpperCase();
  if(!d.nombre)e.nombre="Escribe el nombre.";
  else if(BRS.some(function(x){return x!==b&&x.nombre.toLowerCase()===d.nombre.toLowerCase();}))e.nombre="Ya existe una sucursal con ese nombre.";
  if(!locked){if(!/^[A-Z0-9]{2,5}$/.test(d.codigo))e.codigo="Usa de 2 a 5 letras o números, sin espacios.";
    else if(BRS.some(function(x){return x!==b&&x.codigo===d.codigo;}))e.codigo="Ese código ya está en uso.";}
  if(!d.colorPend&&!hexOk(d.color))e.color="Escribe un color válido, por ejemplo #1C5CA3.";
  c.e=e;if(Object.keys(e).length){renderCfgForm();return;}
  var U=ROLES[S.role].user,col=d.colorPend?null:d.color.toLowerCase();
  if(!b){
    var nb=addBranch({nombre:d.nombre,codigo:d.codigo,color:col,direccion:d.direccion.trim(),estado:d.estado,tz:d.tz,operativo:d.operativo},U);
    S.flash={cls:"m-ok",html:'<strong>Sucursal '+esc(nb.nombre)+' creada.</strong>No se asignó a ningún usuario. La asignación de personas y permisos es aparte.'};
  } else {
    var L={nombre:"Nombre",codigo:"Código",direccion:"Dirección",estado:"Estado de la República",tz:"Zona horaria",operativo:"Estado operativo"},ch=[];
    var nv={nombre:d.nombre,codigo:locked?b.codigo:d.codigo,direccion:d.direccion.trim(),estado:d.estado,tz:d.tz,operativo:d.operativo};
    Object.keys(L).forEach(function(k){if(nv[k]!==b[k]){var a=k==="operativo"?OPER[b[k]].l:(b[k]||"vacío"),z=k==="operativo"?OPER[nv[k]].l:(nv[k]||"vacío");ch.push(L[k]+": "+a+" → "+z);}});
    if((b.color||null)!==col)ch.push("Color: "+(b.color||"pendiente")+" → "+(col||"pendiente"));
    if(!ch.length){S.cfg=null;S.flash={cls:"m-info",html:'<strong>Sin cambios.</strong>'};render();return;}
    Object.assign(b,nv);b.color=col;b.log.push({at:new Date(),by:U,t:"Edición",d:ch.join("; ")});
    S.flash={cls:"m-ok",html:'<strong>'+esc(b.nombre)+' actualizada.</strong>'+esc(ch.join("; "))+'.'+(nv.operativo==="inactiva"?' Su historial se conserva.':'')};
  }
  S.cfg=null;render();window.scrollTo(0,0);
}

function total(){return S.draft.visitors.length*TARIFA;}
function renderForm(){
  var b=br();

  if(b.operativo!=="activa"){view.innerHTML=operNotice();return;}

  var vhtml=d.visitors.map(function(v,i){
    var isC=multi&&d.contacto===i;
    var opts='<option value="">Selecciona…</option>'+ESTADOS.map(function(x){return '<option'+(v.estado===x?' selected':'')+'>'+esc(x)+'</option>';}).join("");

      '<div class="field"><label for="e-'+v.key+'">Procedencia</label><select class="inp" id="e-'+v.key+'" data-v="'+i+'" data-k="estado">'+opts+'</select></div></div></div>';
  }).join("");
  var cond="";

      '<div class="change" aria-live="polite"><div class="sub">Cambio</div><div class="v money" id="o-cambio">'+(has&&rec>=tot?money(rec-tot):'—')+'</div></div></div>'+
      (e.recibido?'<div class="err">'+esc(e.recibido)+'</div>':'')+'<div class="sub">A la bolsa de visitas entra '+money(tot)+'.</div>';
  } else if(d.metodo){
    var isT=d.metodo==="tarjeta";
    cond='<label class="check" for="f-ev"><input type="checkbox" id="f-ev"'+(d.evidencia?' checked':'')+'><span>'+(isT?'La terminal muestra <b>«aprobado»</b>':'Revisé el <b>comprobante</b> del cliente')+'</span></label>'+
      (e.evidencia?'<div class="err">'+esc(e.evidencia)+'</div>':'')+
      '<div class="field"><label for="f-ref">Referencia</label><input type="text" id="f-ref" value="'+esc(d.referencia)+'" autocomplete="off" placeholder="'+(isT?'Ej. FICT-AUT-0000':'Ej. FICT-RASTREO-0000')+'"></div>'+
      (isT?'':'<div class="sub">El abono queda pendiente de verificar.</div>');

  view.innerHTML='<div class="reg"><section class="card"><div class="card-h"><h2>Visitantes</h2><span class="chip c-brand">'+plural(n,"persona","personas")+'</span></div>'+vhtml+
    '<button class="addv" id="b-add">+ Añadir visitante</button><div class="actions left"><button class="btn sm ghost" id="b-ex">Cargar ejemplo de 3 visitantes</button></div></section>'+
  '<section class="card paycol"><div class="card-h"><h2>Pago</h2></div>'+

    (e.metodo?'<div class="err">'+esc(e.metodo)+'</div>':'')+cond+

function closeInline(){S.openAccess=null;S.openFix=null;S.fixErr=null;S.openCancel=false;}
function render(){
  applyBrand();renderChrome();
  var t=S.tab;
  if(t==="inicio")renderInicio();
  else if(t==="registrar"){if(S.step==="form")renderForm();else if(S.step==="summary")renderSummary();else if(S.step==="receipt")renderReceipt();else renderDetail();}
  else if(t==="historial"){if(S.currentId&&S.step==="receipt")renderReceipt();else if(S.currentId)renderDetail();else renderHist();}
  else if(t==="autorizaciones")renderAuth();
  else if(t==="config")renderConfig();
  else renderRules();
}
function resetWork(){S.step="form";S.draft=blankDraft();S.errors={};S.currentId=null;S.detailFrom=null;S.flash=null;S.cfg=null;closeInline();}
function goTab(t,filter){S.tab=t;S.flash=null;closeInline();if(t!=="registrar"||S.step==="result"||S.step==="receipt"){S.currentId=null;S.detailFrom=null;if(S.step!=="summary")S.step="form";}
  if(filter){S.hist={q:"",f:filter};}render();window.scrollTo(0,0);}

function validate(){
  var d=S.draft,e={};
  if(!d.metodo)e.metodo="Elige la forma de pago.";
  else if(d.metodo==="efectivo"){var r=Number(d.recibido);if(d.recibido===""||isNaN(r))e.recibido="Captura el importe recibido.";else if(r<total())e.recibido="El importe recibido es menor que el total de "+money(total())+".";}
  else if(!d.evidencia)e.evidencia=d.metodo==="tarjeta"?"Confirma que la terminal muestra «aprobado».":"Confirma que revisaste el comprobante.";
  S.errors=e;return !Object.keys(e).length;
}

}

  if(ds.fixno){S.openFix=null;S.fixErr=null;render();return;}
  if(ds.fixyes!=null){
    var of=curOp(),vi=Number(ds.fixyes),v0=of.visitors[vi];
    var nv2={nombre:document.getElementById("x-n").value.trim(),telefono:document.getElementById("x-t").value.trim(),estado:document.getElementById("x-e").value};
    var mot=document.getElementById("x-m").value.trim(),L={nombre:"Nombre",telefono:"Teléfono",estado:"Procedencia"},ch=[];
    Object.keys(L).forEach(function(kk){if(nv2[kk]!==v0[kk])ch.push(L[kk]+": "+(v0[kk]||"sin dato")+" → "+(nv2[kk]||"sin dato"));});
    if(!ch.length){S.fixErr="No cambiaste ningún dato.";render();return;}
    if(!mot){S.fixErr="Escribe el motivo.";render();document.getElementById("x-m").focus();return;}
    v0.nombre=nv2.nombre;v0.telefono=nv2.telefono;v0.estado=nv2.estado;v0.corrected=true;
    of.log.push({at:new Date(),by:U,t:"Corrección de datos",d:"Visitante "+(vi+1)+" · "+ch.join("; "),motivo:mot});
    S.openFix=null;S.fixErr=null;S.flash={cls:"m-ok",html:'<strong>Datos corregidos.</strong>El cobro no cambió; el valor anterior quedó en el historial.'};render();return;
  }
  if(ds.f){S.hist.f=ds.f;S.flash=null;renderHist();return;}
  if(ds.id){S.currentId=Number(ds.id);S.detailFrom="historial";if(S.step==="receipt")S.step="form";S.flash=null;closeInline();render();window.scrollTo(0,0);return;}
});

render();
})();
</script>
